name: Publish npm packages

# Publishes @team-spotube/theme-tool and create-spotube-theme to npm.
#   - push a tag like tools-v1.2.0 (it must match packages/theme-tool/package.json), or
#   - run the workflow by hand (Actions -> Publish npm packages). Tick "dry run" to see what would be published.
# A package whose version is already on npm is skipped, so re-running is safe. Needs the NPM_TOKEN repository secret
# (an npm automation token with publish rights on the @team-spotube scope). Releases of the themes themselves use
# plain v* tags and live in release.yml.
on:
  push:
    tags: ['tools-v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (build and pack, publish nothing)
        type: boolean
        default: false
      dist_tag:
        description: npm dist-tag (latest, next, ...)
        type: string
        default: latest

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
      DIST_TAG: ${{ github.event.inputs.dist_tag || 'latest' }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: The tag must match the tool's version
        if: startsWith(github.ref, 'refs/tags/tools-v')
        run: |
          version=$(node -p "require('./packages/theme-tool/package.json').version")
          if [[ "${GITHUB_REF_NAME}" != "tools-v$version" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match @team-spotube/theme-tool version $version"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Build and typecheck
        run: |
          pnpm tool
          pnpm --filter @team-spotube/theme-tool typecheck
          pnpm --filter create-spotube-theme typecheck

      - name: Check the themes against the freshly built tool
        run: pnpm build && pnpm check

      - name: Publish
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" != "true" && -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::The NPM_TOKEN secret is not set"
            exit 1
          fi
          # theme-tool first: create-spotube-theme depends on it.
          for dir in packages/theme-tool packages/create-spotube-theme; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::notice::$name@$version is already on npm, skipping"
              continue
            fi
            args=(--access public --no-git-checks --tag "$DIST_TAG")
            if [[ "$DRY_RUN" == "true" ]]; then
              (cd "$dir" && pnpm publish "${args[@]}" --dry-run)
            else
              (cd "$dir" && pnpm publish "${args[@]}" --provenance)
              echo "::notice::published $name@$version"
            fi
          done
