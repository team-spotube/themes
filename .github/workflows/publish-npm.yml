name: Publish npm packages

# Publishes @team-spotube/theme-tool and create-spotube-theme to npm, at the version in each package.json.
#   - runs on every push to main that touches a package (bump "version" in the package.json you want to release), or
#   - by hand (Actions -> Publish npm packages); tick "dry run" to see what would be published.
# No tags are involved: the version comes only from package.json. A package whose version is already on npm is
# skipped, so pushes that don't bump a version publish nothing. Needs the NPM_TOKEN repository secret (an npm
# automation token with publish rights on the @team-spotube scope). Theme releases live in release.yml.
on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.github/workflows/publish-npm.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (build and pack, publish nothing)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Build and typecheck
        run: |
          pnpm tool
          pnpm --filter @team-spotube/theme-tool typecheck
          pnpm --filter create-spotube-theme typecheck

      - name: Check the themes against the freshly built tool
        run: pnpm build && pnpm check

      - name: Publish
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" != "true" && -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::The NPM_TOKEN secret is not set"
            exit 1
          fi
          # theme-tool first: create-spotube-theme depends on it.
          for dir in packages/theme-tool packages/create-spotube-theme; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::notice::$name@$version is already on npm, skipping"
              continue
            fi
            # A pre-release version (1.2.0-beta.1) goes to the "next" dist-tag so it never becomes "latest".
            tag=latest
            [[ "$version" == *-* ]] && tag=next
            args=(--access public --no-git-checks --tag "$tag")
            if [[ "$DRY_RUN" == "true" ]]; then
              (cd "$dir" && pnpm publish "${args[@]}" --dry-run)
            else
              (cd "$dir" && pnpm publish "${args[@]}" --provenance)
              echo "::notice::published $name@$version"
            fi
          done
